# Keeps the SHA-pinned actions in .github/workflows current (Dependabot updates the SHA and the version
# comment together). No pip ecosystem: every tool version comes from the ansible-runtime image
# (RUNTIME_IMAGE in ansible-test.yml), whose Renovate bumps them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
