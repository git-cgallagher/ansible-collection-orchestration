# Keeps the SHA-pinned actions in .github/workflows current (Dependabot updates the SHA and the version
# comment together), and the Molecule scenario's pip pins in extensions/molecule/requirements.txt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /extensions/molecule
    schedule:
      interval: monthly
    # ansible-core tracks the ansible-test matrix, which moves by hand.
    ignore:
      - dependency-name: ansible-core
    groups:
      molecule:
        patterns: ['*']
