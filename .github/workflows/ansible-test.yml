name: ansible-test

on:
  push:
    branches: [main]
  pull_request:
  # The plugin hooks into ansible-core strategy internals, so run weekly against devel to catch
  # upstream changes before they reach a release.
  schedule:
    - cron: '0 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.testing-type }} (${{ matrix.ansible-core-version }})
    runs-on: ubuntu-latest
    # devel is an early warning, not a merge gate
    continue-on-error: ${{ matrix.ansible-core-version == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with requires_ansible in meta/runtime.yml.
        ansible-core-version:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - devel
        testing-type:
          - sanity
          - units
          - integration
        exclude:
          # devel's test container can't start on GitHub runners (ansible-test fails remounting
          # /sys/fs/cgroup), so devel integration runs without a container in integration-devel below.
          - ansible-core-version: devel
            testing-type: integration
    steps:
      - uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: ${{ matrix.testing-type }}

  integration-devel:
    name: integration (devel, venv)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          path: ansible_collections/git_cgallagher/orchestration
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install ansible-core devel
        run: pip install https://github.com/ansible/ansible/archive/devel.tar.gz
      - name: Run integration tests
        working-directory: ansible_collections/git_cgallagher/orchestration
        run: ansible-test integration --venv --python 3.14 --color -v
