name: ansible-test

on:
  push:
    branches: [main]
  pull_request:
  # Monthly, so new ansible-core stable point releases get tested even when no PR is open. The plugin
  # hooks ansible-core internals, so an upstream change can break it without any change here.
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# The Molecule job runs in the ansible-runtime image (.github/ci/runtime.sh): pinned
# ansible-core, Molecule, the molecule-git-cgallagher driver and community.docker, so it
# installs nothing. Bump the tag AND digest together, to an ansible-runtime release. The
# ansible-test matrix installs its own ansible-core per version.
# RUNTIME_IMAGE is where every other tool version comes from (ansible-runtime's shared
# dependency model): galaxy-publish.yml reads the image's constraints.txt from this line.
env:
  RUNTIME_IMAGE: ghcr.io/git-cgallagher/ansible-runtime:0.5.0-ci@sha256:f5213eaa162158646e61c29e9c11f8b2dd4bcaf1f8c7ac9f98a90418ee5cef5f

# Every job sets timeout-minutes: GitHub's default is 6 hours, and a stalled
# install or image pull would hold the runner that long. Each limit is several
# times the job's slowest green run (2026-11-01).
jobs:
  test:
    name: ${{ matrix.testing-type }} (${{ matrix.ansible-core-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with requires_ansible in meta/runtime.yml.
        ansible-core-version:
          - stable-2.19
          - stable-2.20
          - stable-2.21
        testing-type:
          - sanity
          - units
          - integration
    steps:
      - uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3  # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: ${{ matrix.testing-type }}

  # Four containers reached over the community.docker.docker connection: the same spacing checks as the
  # integration target, but with every task going over a real remote connection. Runs on the newest stable core.
  molecule:
    name: molecule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Molecule builds this checkout and installs it as git_cgallagher.orchestration, so the scenario tests the
      # packaged collection. A run that never releases a host hangs instead of failing, hence the timeout.
      - name: molecule test
        timeout-minutes: 15
        run: .github/ci/runtime.sh molecule test
