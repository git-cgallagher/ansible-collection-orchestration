# No play-level offset: only the task that sets the variable is staggered.
- hosts: probe_hosts
  gather_facts: false
  strategy: cgallagher.orchestration.time_offset
  vars:
    probe: "{{ ansible_playbook_python }} {{ playbook_dir }}/probe.py {{ probe_log }} {{ inventory_hostname }}"
  tasks:
    - name: Unoffset task
      ansible.builtin.command: "{{ probe }} unoffset 0"
      changed_when: false

    - name: Offset task
      ansible.builtin.command: "{{ probe }} offset 0"
      changed_when: false
      vars:
        time_offset_seconds: 1
